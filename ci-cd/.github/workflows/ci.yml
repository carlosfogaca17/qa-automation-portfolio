name: QA Automation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job único e didático: instala deps, roda web e api, e publica relatórios.
  test:
    name: Web + API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Web tests
        run: npm run test:web
        env:
          CI: 'true'

      - name: Run API tests
        run: npm run test:api
        env:
          CI: 'true'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            web/playwright/playwright-report/
            api/playwright/playwright-report/
          retention-days: 7

  # Job de performance: roda o k6 contra uma API local (service container) e usa
  # os thresholds como gate de qualidade. O job falha se o p95 / taxa de erro
  # excederem os SLOs definidos no script.
  performance:
    name: Performance (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # API local (ServeRest) usada como alvo do k6 — estável e alinhada ao projeto
    # (o ServeRest pede que teste de carga NÃO rode no serverest.dev público).
    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/usuarios || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.49.0'

      # Smoke: valida saúde e SLOs básicos (p95 < 500ms, erro < 1%).
      - name: Run k6 smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: performance/k6/smoke.test.js
        env:
          API_URL: 'http://localhost:3000'

      # Exporta o resultado completo (JSON) como artefato para análise.
      - name: Run k6 smoke (summary export)
        if: always()
        run: k6 run --summary-export=reports/k6/smoke-summary.json performance/k6/smoke.test.js
        env:
          API_URL: 'http://localhost:3000'
        continue-on-error: true

      - name: Upload k6 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-reports
          path: |
            reports/k6/
          retention-days: 7
