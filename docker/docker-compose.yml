# Infraestrutura local para o portfólio (Docker Compose).
# Sobe um PostgreSQL já inicializado com o schema e seed do projeto.

services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
      POSTGRES_DB: ${POSTGRES_DB:-qa_portfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Scripts executados automaticamente na 1ª inicialização do volume.
      - ../database/postgresql/schema:/docker-entrypoint-initdb.d/01-schema:ro
      - ../database/postgresql/seed:/docker-entrypoint-initdb.d/02-seed:ro
      # Persistência dos dados entre execuções.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa_user} -d ${POSTGRES_DB:-qa_portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Observabilidade -------------------------------------------------------

  # Prometheus: recebe métricas do k6 (Remote Write) e faz scrape do exporter.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: qa-portfolio-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Habilita o receptor de Remote Write usado pelo k6.
      - '--web.enable-remote-write-receiver'
      # Native histograms: necessário para o k6 publicar trend metrics via
      # remote-write com K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      # (alimenta os alertas e o dashboard de latência p95/p99).
      - '--enable-feature=native-histograms'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - test-metrics-exporter
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Grafana: dashboards e datasource provisionados automaticamente.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: qa-portfolio-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: ''
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Exporter: converte os relatórios JSON do Playwright em métricas Prometheus.
  test-metrics-exporter:
    build:
      context: ../observability/exporter
      dockerfile: Dockerfile
    container_name: qa-portfolio-test-exporter
    restart: unless-stopped
    environment:
      REPORTS_DIR: /reports
      SUITES: 'web,api'
      K6_DIR: /reports/k6
      PORT: '9101'
      REFRESH_INTERVAL_MS: '15000'
    ports:
      - "${EXPORTER_PORT:-9101}:9101"
    volumes:
      # Lê (somente) os relatórios gerados pelos testes na raiz do projeto.
      - ../reports:/reports:ro

  # --- API local (alvo do k6) ----------------------------------------------

  # ServeRest: API REST de prática. É o alvo recomendado para o k6 rodar
  # LOCALMENTE (o projeto ServeRest pede que teste de carga não rode no
  # serverest.dev público). Acesse em http://localhost:3000.
  serverest:
    image: paulogoncalvesbh/serverest:latest
    container_name: qa-portfolio-serverest
    restart: unless-stopped
    ports:
      - "${SERVEREST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/usuarios || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Notificações (opcional) ---------------------------------------------

  # Alertmanager: recebe os alertas do Prometheus e envia e-mails via SMTP.
  # Só sobe com o profile 'alerting' para não exigir variáveis SMTP no dia a dia:
  #   docker compose --profile alerting up -d alertmanager
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: qa-portfolio-alertmanager
    restart: unless-stopped
    profiles: ["alerting"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/template.tmpl:/etc/alertmanager/template.tmpl:ro
      - alertmanager_data:/alertmanager
    environment:
      SMTP_SERVER: ${SMTP_SERVER:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-alertmanager@example.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      ALERT_RECEIVER_EMAIL: ${ALERT_RECEIVER_EMAIL:-qa-team@example.com}

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
