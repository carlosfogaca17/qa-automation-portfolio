# Provisionamento automático do datasource do Prometheus no Grafana.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # 'prometheus' é o nome do serviço na rede do Docker Compose.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # Datasource do Alertmanager — usado pelo painel "Alertas" (tipo Alert list).
  # Fica vazio/inativo enquanto o serviço 'alertmanager' não estiver no ar
  # (profile 'alerting'); o painel simplesmente não retorna dados nesse caso.
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

