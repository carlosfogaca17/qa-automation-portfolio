name: QA Automation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job único e didático: instala deps, roda web e api, e publica relatórios.
  test:
    name: Web + API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Web tests
        run: npm run test:web
        env:
          CI: 'true'

      - name: Run API tests
        run: npm run test:api
        env:
          CI: 'true'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            web/playwright/playwright-report/
            api/playwright/playwright-report/
          retention-days: 7
